# The one compose file, used in production (~/flyfunboarding/server) and locally.
# Deploy:  cd ~/flyfunboarding/server && git pull && docker compose up -d --build
# No --env-file flags: compose reads .env automatically for the ${...} values below, and
# the secrets reach the container through env_file, never through ${...} interpolation.

services:
  flyfunboarding-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flyfunboarding-api
    restart: unless-stopped
    # Secrets (DB_PASSWORD, SECRET, CERTIFICATE_PASSWORD) go in verbatim from .env.secrets
    # (sops-managed, mode 600). Only that file is passed whole: the host .env holds host
    # paths (CERTIFICATE_PATH, KEYS_PATH, ...) that must not reach the container.
    # Quote secret values with single quotes (see .env.secrets.sample).
    env_file:
      - path: .env.secrets
        required: true
    # Non-secret settings: container paths, plus plain values interpolated from .env.
    # Do not add secrets here (environment: would also override env_file).
    environment:
      # Database - connect to shared MySQL via network name
      DB_HOST: shared-mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME:-flyfunboarding}

      # Security
      USE_PUBLIC_KEY_SIGNATURE: ${USE_PUBLIC_KEY_SIGNATURE:-true}

      # PKPass - paths inside container (signing key: /app/certs/certificate.key)
      CERTIFICATE_PATH: /app/certs/certificate.pem
      WWDR_PATH: /app/certs/AppleWWDRCA.pem

      # File paths inside container
      KEYS_PATH: /app/keys
      IMAGES_PATH: /app/images

      # API Config
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      # Mount secrets/data from parent directory (repo root)
      - ../certs:/app/certs:ro
      - ../keys:/app/keys        # read-write: the server creates per-airline key pairs
      - ../images:/app/images:ro
    ports:
      - "127.0.0.1:8010:8000"  # localhost only; Caddy handles external traffic
    networks:
      - shared-services
    # Note: depends_on doesn't work across compose files
    # Make sure shared-infra MySQL is running before starting this service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  shared-services:
    external: true  # This network is created by shared-infra
