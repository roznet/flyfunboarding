[project]
name = "flyfun-boarding-api"
version = "1.0.0"
description = "Fly Fun Boarding API - FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Fly Fun Boarding", email = "dev@flyfunboarding.com"}
]

dependencies = [
    # Upper bounds: the next major above what prod runs (2026-11), so a rebuild can't
    # silently pull a breaking release - the Docker build installs untested latest versions.
    # Raise a bound deliberately after testing the new major.
    # Web Framework
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "starlette>=1.0,<2",       # via fastapi; pages.py uses the 1.x TemplateResponse(request, ...) form

    # Database
    "sqlalchemy[asyncio]>=2.0.36,<3",     # Using SQLAlchemy Core (query building), not full ORM
    "aiomysql>=0.2.0,<0.4",      # Async MySQL driver

    # Data Validation & Serialization
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.0,<3",  # app/config.py subclasses DotEnvSettingsSource internals

    # PKPass Generation
    "passes-rs-py>=0.1.0,<5",    # Rust-based, high-performance PKPass library

    # Cryptography
    "cryptography>=44.0.0,<51",

    # Utilities
    "python-multipart>=0.0.12,<0.1",
    "python-dotenv>=1.0.0,<2",  # config.py calls dotenv_values(interpolate=False)

    # Language Detection & Templates
    "babel>=2.16.0,<3",          # Internationalization with Accept-Language parsing
    "jinja2>=3.1.4,<4",          # HTML template engine for web pages

    # HTTP Client (for health checks, external APIs)
    "httpx>=0.28.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",          # For async testing
    "ruff>=0.8.0",            # Fast Python linter
    "mypy>=1.13.0",           # Type checking
]

[project.scripts]
flyfun-api = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # Common rules + import sorting

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"  # All tests share same event loop
testpaths = ["tests"]

